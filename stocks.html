<style>
.flash-new{
  position:absolute;
  top:-14px;
  right:-14px;
  z-index:50;
  padding:6px 10px;
  border-radius:20px;
  background:#ff1515;
  color:white;
  font-size:11px !important;
  font-weight:900 !important;
  line-height:1 !important;
  box-shadow:0 3px 12px rgba(0,0,0,.45);
  animation:flash .65s infinite;
}

@keyframes flash{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }
  50%{
    opacity:.15;
    transform:scale(1.12)
  }
}
</style>
